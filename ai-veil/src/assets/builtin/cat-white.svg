<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img">
  <title>白色小猫</title>
  <!-- 尾巴：从身体右侧探出并向上卷起 -->
  <path d="M139 108 C164 110 182 98 180 78 C178 62 164 56 156 64 C150 70 152 78 160 79"
        fill="none" stroke="#C7C9D1" stroke-width="8" stroke-linecap="round"/>
  <!-- 身体 -->
  <path d="M62 118 C60 94 72 80 100 80 C128 80 140 94 138 118 Z"
        fill="#F2F3F5" stroke="#C7C9D1" stroke-width="3" stroke-linejoin="round"/>
  <!-- 两只耳朵 -->
  <path d="M74 34 L66 12 L92 22 Z" fill="#F2F3F5" stroke="#C7C9D1" stroke-width="3" stroke-linejoin="round"/>
  <path d="M126 34 L134 12 L108 22 Z" fill="#F2F3F5" stroke="#C7C9D1" stroke-width="3" stroke-linejoin="round"/>
  <!-- 耳朵内侧 -->
  <path d="M78 30 L73 19 L86 25 Z" fill="#FFD1DC"/>
  <path d="M122 30 L127 19 L114 25 Z" fill="#FFD1DC"/>
  <!-- 脸 -->
  <circle cx="100" cy="54" r="33" fill="#F2F3F5" stroke="#C7C9D1" stroke-width="3"/>
  <!-- 腮红 -->
  <ellipse cx="76" cy="66" rx="9" ry="6" fill="#FF9AA2" opacity="0.4"/>
  <ellipse cx="124" cy="66" rx="9" ry="6" fill="#FF9AA2" opacity="0.4"/>
  <!-- 两只眼睛 -->
  <ellipse cx="87" cy="52" rx="5" ry="6.5" fill="#2B2B31"/>
  <ellipse cx="113" cy="52" rx="5" ry="6.5" fill="#2B2B31"/>
  <circle cx="88.8" cy="49.4" r="1.7" fill="#FFFFFF"/>
  <circle cx="114.8" cy="49.4" r="1.7" fill="#FFFFFF"/>
  <!-- 鼻子与嘴 -->
  <path d="M96 62 L104 62 L100 67 Z" fill="#FFB3C1"/>
  <path d="M100 67 L100 70" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 70 C96 76 90 75 88 71" fill="none" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 70 C104 76 110 75 112 71" fill="none" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <!-- 胡须 -->
  <path d="M72 58 L52 53" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 65 L51 65" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 72 L53 78" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M128 58 L148 53" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M128 65 L149 65" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
  <path d="M128 72 L147 78" stroke="#C7C9D1" stroke-width="2" stroke-linecap="round"/>
</svg>

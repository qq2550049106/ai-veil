  <!-- 内层柔光，增加体积感 -->
  <path d="M70 26 C110 18 156 26 167 46 C175 64 156 88 122 93 C88 98 44 88 40 66 C37 48 48 31 70 26 Z"
        fill="#FFFFFF" fill-opacity="0.18"/>

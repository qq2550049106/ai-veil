<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img">
  <title>有机曲线</title>
  <defs>
    <linearGradient id="blobFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
  </defs>
  <!-- 四段贝塞尔拼成的略不对称有机轮廓 -->

# AI-Veil 配置样例 —— 所有键名与默认值以此文件为准
# 路径：~/.ai-veil/config.toml

[meta]
version = 1
theme = "orange"            # orange | cyan | mono | contrast

# ---------- 视觉：范围边框（可完全关闭） ----------
[border]
visible = true              # false = 完全不出现边框（不创建边框层）
scope = "fullscreen"        # fullscreen | region | window | none
width = 4
radius = 12
style = "solid"             # solid | dashed | dotted | double | gradient
color = "#FF7A18"
color_end = "#FFB347"       # style=gradient 时生效
glow = "0 0 24px rgba(255,122,24,.45)"
animation = "breathe"       # none | breathe | dash | scan | pulse
animation_duration = 2.0
opacity = 1.0
inset = 0                   # 向内收缩像素，避免遮挡系统 UI
follow_display = true       # 多显示器跟随目标屏

[border.per_event]          # 按事件类型覆盖，只写差异项
need_human = { color = "#FF3B30", animation = "pulse", width = 6 }
error      = { color = "#FF3B30", animation = "scan" }
heartbeat  = { visible = false }

# ---------- 视觉：横幅与形状（猫咪等 DIY） ----------
[banner]
visible = true
shape = "cat"               # rect | pill | speech_bubble | cat | paw | blob | star | custom_svg | image
variant = "orange"          # cat 内置变体：orange | black | white
anchor = "top-center"       # top-center | top-left | top-right | bottom-center | custom
offset = { x = 0, y = 24 }
size = { w = 320, h = 96 }
scale = 1.0
rotation = 0
opacity = 0.95
blur = 20                   # 背景模糊强度（部分形状不支持）
padding = { x = 18, y = 12 }
text_color = "#FFFFFF"
align = "center"            # left | center | right
max_lines = 2
overflow = "ellipsis"       # ellipsis | wrap | shrink

[banner.font]
family = "system"
size = 15
weight = 500
letter_spacing = 0.3

[banner.custom]             # shape = custom_svg / image 时生效
svg_path = "~/Pictures/mascot.svg"
image_fit = "contain"       # contain | cover | fill
tint = "#FF7A18"            # 单色着色（仅 SVG 生效）

[banner.animation]
idle = "blink"              # none | blink | wag | float | wiggle
enter = "pop"               # none | fade | slide | pop
duration = 0.35

# ---------- 文案（字眼可完全自定义） ----------
[text]
start    = "{agent} 正在接管你的电脑"
running  = "{agent} 正在操控 · {action}"
waiting  = "需要你介入 · {action}"
end      = "操控已结束 · 共 {duration}"
error    = "操控异常中断 · {action}"
cancel_button = "中止"
# 可用变量：{agent} {action} {target} {duration} {time}

# ---------- 声音 ----------
[sound]
enabled = true
volume = 0.6
throttle_ms = 800
custom_path = ""            # 留空则用 Web Audio 合成

[sound.synth]
start_wave = "sine"
start_freq = 660
start_dur = 0.12
end_wave = "sine"
end_freq = 440
end_dur = 0.18
alert_wave = "square"
alert_freq = 880
alert_dur = 0.25

[sound.events]              # 按事件开关
session_start = true
session_end = true
need_human = true
error = true
action = false              # 动作级默认不响，避免噪音

# ---------- 桌面通知 ----------
[notify]
enabled = true
duration_sec = 5
thumbnail = false           # 是否附带截屏缩略图（默认关闭，隐私优先）
silent = false

# ---------- 规则 ----------
[rules]
ttl_ms = 30000              # 超时自动判定会话结束
min_takeover_ms = 600       # 最小接管时长，防闪烁
ignore_events = ["heartbeat"]
dnd_start = ""              # 免打扰起始，如 "23:00"
dnd_end = ""                # 免打扰结束，如 "08:00"
process_whitelist = []
process_blacklist = []

# ---------- 交互 ----------
[hotkeys]
cancel = "Ctrl+Alt+Esc"
toggle_visible = "Ctrl+Alt+V"
next_theme = "Ctrl+Alt+T"

# ---------- 素材管线 ----------
[assets]
dirs = ["~/.ai-veil/assets/"]
max_bytes = 524288          # 512KB
max_px = 4096
sanitize_svg = true

# ---------- 隐私 ----------
[privacy]
upload_enabled = false      # 永远默认关闭，数据仅本机处理
log_dir = "~/.ai-veil/logs"
